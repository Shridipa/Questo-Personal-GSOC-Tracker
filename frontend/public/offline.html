<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffdf7" />
    <title>You're offline | Questo</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #243146; background: #fffdf7; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid #e9edf0; border-radius: 20px; background: #fff; box-shadow: 0 12px 32px rgba(38, 55, 75, .06); }
      .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; color: white; background: #58c776; font-size: 25px; font-weight: 800; }
      h1 { margin: 22px 0 8px; font-size: 26px; }
      p { color: #738091; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 15px; border-radius: 10px; color: #fff; background: #23944b; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #4d9fe8; outline-offset: 3px; }
      .secondary { border: 1px solid #e3e8e9; color: #445163; background: #fff; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true" class="mark">✦</div>
      <h1>You're offline</h1>
      <p>Questo needs a connection to load your latest saved data. Changes are not queued or saved while offline. Reconnect and try again.</p>
      <nav aria-label="Offline options">
        <a href="/">Try Questo again</a>
        <a class="secondary" href="/quests">Back to quests</a>
      </nav>
    </main>
  </body>
</html>
